version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Held-back MAJORS — both are gated on eslint-config-next@16.2.10, which
    # bundles typescript-eslint@8 (owns @typescript-eslint/typescript-estree) and
    # eslint-plugin-react@7.37, neither of which supports these majors yet:
    #   - eslint 10 removed `context.getFilename()`; eslint-plugin-react@7.37 still
    #     calls it → "getFilename is not a function" (rule react/display-name).
    #   - typescript 7 (native port) changed internals typescript-estree@8 reads
    #     (`ModuleKind.Cjs` → undefined); Next/Payload don't target TS7 yet either.
    # These only become safe once a newer eslint-config-next ships updated plugins
    # (or the project moves off it). Revisit then. Minor/patch keep flowing.
    ignore:
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      payload:
        patterns:
          - '@payloadcms/*'
          - 'payload'
      # The PDF Lambda's headless-browser pair is version-coupled: puppeteer-core
      # speaks a Chromium-version-specific DevTools protocol, and @sparticuz/chromium
      # tracks Chromium releases. Bump them in ONE PR so CI typecheck validates the
      # pairing (a Chromium major can also change the module API — e.g. v133 dropped
      # `defaultViewport`/`headless`). Runtime (Chromium-on-Lambda) is still only
      # provable on a staging deploy, so review these before merging.
      browser:
        patterns:
          - '@sparticuz/chromium'
          - 'puppeteer-core'
      # Everything else: ONE weekly PR for all minor + patch bumps, instead of one
      # PR per package. Added 2026-09-18 with 12 same-week single-package PRs
      # open — and every merge to `main` is a full staging deploy + a production
      # approval, so one grouped PR is one deploy, not twelve. Dependabot puts a
      # dependency in the FIRST group that matches, so the payload/browser groups
      # above keep their own PRs (their pairing must be reviewed together). Major
      # bumps are deliberately NOT grouped: each one needs its own review.
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Tracks the image tags pinned in docker-compose.yml (postgres:18-alpine,
  # adobe/s3mock:5.2.2). This is the `docker-compose` ecosystem on purpose: the
  # `docker` ecosystem parses Dockerfiles ONLY, so until 2026-09-13 this entry
  # was tracking a stock, non-building Dockerfile template (since removed — the
  # app deploys to Lambda via OpenNext, not a container) while the compose file
  # it claimed to cover was never checked. It still does NOT cover the two image
  # tags pinned inside .github/workflows/ci.yml's `services:` block — Dependabot
  # doesn't parse workflow files for images — so those stay a manual,
  # periodic-review item: keep them identical to docker-compose.yml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
